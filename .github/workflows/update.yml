name: Fantasy Baseball Update

on:
  schedule:
    # Daily prediction update — 11:00 UTC
    - cron: "0 11 * * *"

    # Weekly model retraining — Monday at 12:00 UTC
    - cron: "0 12 * * 1"

  workflow_dispatch:
  inputs:
    update_type:
      description: "Choose the update type"
      required: true
      default: "daily"
      type: choice
      options:
        - daily
        - weekly

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly retraining
        if: >
          github.event_name == 'schedule' &&
          github.event.schedule == '0 12 * * 1' ||
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.update_type == 'weekly'
        run: |
          python -m src.weekly_update

      - name: Run daily update
        if: github.event_name == 'schedule' && github.event.schedule == '0 11 * * *'
        run: |
          python -m src.daily_update

      - name: Run manually triggered update
        if: >
          github.event_name == 'schedule' &&
          github.event.schedule == '0 11 * * *' ||
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.update_type == 'daily'
        run: |
          python -m src.daily_update

      - name: Commit updated data, predictions, and model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/latest_predictions.csv
          git add data/processed/pitcher_games_features_base.csv
          git add models/xgboost.pkl
          git add models/model_features.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update pitcher predictions and model"
            git push
          fi