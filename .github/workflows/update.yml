name: Fantasy Baseball Update

on:
  schedule:
    # Daily update at 11:00 UTC
    - cron: "0 11 * * *"

    # Weekly retraining every Wednesday at 12:00 UTC
    - cron: "0 12 * * 3"

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly retraining
        if: github.event.schedule == '0 12 * * 3' || github.event_name == 'workflow_dispatch'
        run: |
          python src/weekly_update.py

      - name: Run daily update
        run: |
          python src/daily_update.py

      - name: Commit updated predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/processed/latest_predictions.csv

          git diff --cached --quiet || git commit -m "Update daily pitcher predictions"

          git push